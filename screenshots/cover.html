<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0} body{width:1600px;height:1000px;background:#F2E8CF url(../brand/logo/pattern-waves.svg);background-size:260px;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.browser{position:absolute;left:70px;top:160px;width:1060px;border-radius:16px;overflow:hidden;box-shadow:0 30px 60px rgba(15,76,92,.28);background:#fff}
.bar{height:38px;background:#E9E2D3;display:flex;align-items:center;gap:8px;padding:0 16px}.bar i{width:12px;height:12px;border-radius:50%;background:#d0c6b3}
.bar span{margin-left:14px;background:#fff;border-radius:8px;padding:4px 14px;font-size:13px;color:#6b5a52;width:420px}
.browser img{width:100%;display:block}
.phone{position:absolute;right:80px;top:150px;width:330px;border-radius:44px;background:#1d1d1f;padding:14px;box-shadow:0 30px 60px rgba(15,76,92,.35)}
.phone img{width:100%;border-radius:32px;display:block;height:auto}
.tag{position:absolute;left:70px;top:56px}.tag p{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#3A8D8F;font-weight:600}
.tag h1{font-family:Lora,serif;font-size:42px;color:#0F4C5C;margin-top:6px}
</style></head><body>
<div class="tag"><p>Brand identity + website · Concept project</p><h1>Quebra-Mar Café &amp; Padaria</h1></div>
<div class="browser"><div class="bar"><i></i><i></i><i></i><span>quebramar-cafe · demo</span></div><img src="site-desktop-hero.png"></div>
<div class="phone"><img src="site-mobile-hero.png"></div>
</body></html>
